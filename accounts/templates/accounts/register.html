{% extends 'base.html' %}


{% block title %}
    Регистрация
{% endblock %}


{% block content %}

    <section class="auth-section">

        <div class="form-card">

            <div class="section-header">

                <h1>
                    Регистрация
                </h1>

                <p>
                    Создайте аккаунт соискателя
                    или работодателя.
                </p>

            </div>


            <form
                method="post"
                class="site-form"
            >

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="button button-primary button-full"
                >
                    Зарегистрироваться
                </button>

            </form>


            <p class="form-footer">

                Уже есть аккаунт?

                <a href="{% url 'login' %}">
                    Войти
                </a>

            </p>

        </div>

    </section>

{% endblock %}
