{% extends 'base.html' %}


{% block title %}
    Отклик на вакансию
{% endblock %}


{% block content %}

    <section class="auth-section">

        <div class="form-card">

            <h1>
                Отклик на вакансию
            </h1>

            <h2>
                {{ vacancy.title }}
            </h2>

            <p>
                {{ vacancy.company.name }}
            </p>

            <form
                method="post"
                class="site-form"
            >

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="button button-primary button-full"
                >
                    Отправить отклик
                </button>

            </form>

        </div>

    </section>

{% endblock %}
