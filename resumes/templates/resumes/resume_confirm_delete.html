{% extends 'base.html' %}


{% block title %}
    Удаление резюме
{% endblock %}


{% block content %}

    <section class="auth-section">

        <div class="form-card">

            <h1>
                Удалить резюме?
            </h1>

            <p>
                Вы действительно хотите удалить
                резюме
                <strong>{{ resume.title }}</strong>?
            </p>

            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Да, удалить
                </button>

                <a
                    href="{% url 'candidate_dashboard' %}"
                    class="button button-secondary"
                >
                    Отмена
                </a>

            </form>

        </div>

    </section>

{% endblock %}
