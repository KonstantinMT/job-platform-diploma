{% extends 'base.html' %}


{% block title %}
    {{ page_title }}
{% endblock %}


{% block content %}

    <section class="auth-section">

        <div class="form-card">

            <h1>
                {{ page_title }}
            </h1>

            <form
                method="post"
                class="site-form"
            >

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="button button-primary button-full"
                >
                    Сохранить
                </button>

            </form>

        </div>

    </section>

{% endblock %}
